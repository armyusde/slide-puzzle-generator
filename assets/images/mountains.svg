<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5f9a"/>
      <stop offset="0.45" stop-color="#8dbbe0"/>
      <stop offset="0.75" stop-color="#f7d8a8"/>
      <stop offset="1" stop-color="#f3b27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b8d8"/>
      <stop offset="1" stop-color="#c9c4d8"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7fae"/>
      <stop offset="1" stop-color="#8a8fb4"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5276"/>
      <stop offset="1" stop-color="#2c3f5c"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d9bc8"/>
      <stop offset="1" stop-color="#244c76"/>
    </linearGradient>
    <g id="tree">
      <rect x="-2" y="-2" width="4" height="8" fill="#3b2a1a"/>
      <polygon points="0,-34 -12,0 12,0" fill="#1c4530"/>
      <polygon points="0,-42 -9,-16 9,-16" fill="#235638"/>
      <polygon points="0,-42 0,0 12,0 9,-16 " fill="#163a28" opacity="0.6"/>
    </g>
    <polygon id="nearRange" points="0,440 50,400 120,330 175,380 250,260 330,400 390,360 440,410 520,340 600,400 600,520 0,520"/>
    <clipPath id="lakeClip"><rect x="0" y="512" width="600" height="88"/></clipPath>
  </defs>

  <!-- sky -->
  <rect width="600" height="600" fill="url(#sky)"/>
  <circle cx="440" cy="175" r="110" fill="url(#glow)"/>
  <circle cx="440" cy="175" r="42" fill="#fff3c8"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="110" cy="95" rx="55" ry="14"/>
    <ellipse cx="140" cy="84" rx="32" ry="15"/>
    <ellipse cx="90" cy="88" rx="24" ry="11"/>
    <ellipse cx="300" cy="140" rx="45" ry="10"/>
    <ellipse cx="322" cy="132" rx="24" ry="11"/>
    <ellipse cx="540" cy="70" rx="40" ry="10"/>
    <ellipse cx="555" cy="62" rx="20" ry="9"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#2b3550" stroke-width="2.2" stroke-linecap="round">
    <path d="M220,60 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M258,82 q6,-6 12,0 q6,-6 12,0"/>
    <path d="M200,92 q5,-5 10,0 q5,-5 10,0"/>
  </g>

  <!-- far range -->
  <polygon fill="url(#far)" points="0,330 60,270 110,300 170,220 230,290 290,250 340,300 400,230 460,280 520,240 600,300 600,440 0,440"/>
  <g fill="#eef1f8" opacity="0.8">
    <polygon points="170,220 186,240 178,238 170,246 162,238 156,240"/>
    <polygon points="400,230 416,250 407,247 399,254 391,246 386,248"/>
    <polygon points="520,240 535,256 527,254 519,260 512,254 507,255"/>
  </g>

  <!-- middle range -->
  <polygon fill="url(#mid)" points="0,380 80,290 140,340 210,200 280,320 330,290 380,330 470,180 560,320 600,300 600,470 0,470"/>
  <polygon fill="#000" opacity="0.12" points="210,200 280,320 250,330 222,262"/>
  <polygon fill="#000" opacity="0.12" points="470,180 560,320 520,330 488,250"/>
  <g fill="#f8fbff">
    <polygon points="210,200 233,240 222,234 212,246 202,236 190,240"/>
    <polygon points="470,180 502,230 490,224 478,238 466,226 452,236 440,230"/>
    <polygon points="80,290 96,308 88,306 80,314 73,306 66,306"/>
  </g>

  <!-- near range -->
  <use xlink:href="#nearRange" href="#nearRange" fill="url(#near)"/>
  <polygon fill="#000" opacity="0.18" points="250,260 330,400 300,420 266,330"/>
  <polygon fill="#000" opacity="0.18" points="520,340 600,400 600,420 540,380"/>
  <g fill="#ffffff">
    <polygon points="250,260 273,300 262,294 253,306 244,295 232,302 225,300"/>
    <polygon points="120,330 142,350 132,346 122,356 112,347 100,350"/>
    <polygon points="520,340 541,356 532,354 523,362 514,355 505,358"/>
  </g>

  <!-- green foothills -->
  <path fill="#3f7a4c" d="M0,470 Q80,430 160,462 T320,456 T480,452 T600,440 L600,515 L0,515 Z"/>
  <path fill="#2f6340" d="M0,492 Q120,468 230,494 T460,488 T600,482 L600,515 L0,515 Z"/>

  <!-- pine trees -->
  <use xlink:href="#tree" href="#tree" transform="translate(30,480) scale(0.9)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(52,488) scale(1.1)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(78,482) scale(0.8)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(150,470) scale(0.7)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(168,476) scale(0.85)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(260,498) scale(1.2)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(286,502) scale(1.0)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(370,470) scale(0.75)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(470,492) scale(1.0)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(494,486) scale(1.25)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(520,494) scale(0.9)"/>
  <use xlink:href="#tree" href="#tree" transform="translate(575,474) scale(0.8)"/>

  <!-- lake -->
  <rect x="0" y="512" width="600" height="88" fill="url(#lake)"/>
  <g clip-path="url(#lakeClip)" opacity="0.22">
    <use xlink:href="#nearRange" href="#nearRange" fill="#1d2c44" transform="translate(0,1030) scale(1,-1)"/>
  </g>
  <g stroke="#fff4cf" stroke-linecap="round" opacity="0.8">
    <line x1="420" y1="526" x2="460" y2="526" stroke-width="3"/>
    <line x1="428" y1="540" x2="452" y2="540" stroke-width="3"/>
    <line x1="414" y1="556" x2="466" y2="556" stroke-width="2"/>
    <line x1="432" y1="572" x2="448" y2="572" stroke-width="2"/>
  </g>
  <g stroke="#cfe3f5" stroke-linecap="round" stroke-width="2" opacity="0.5">
    <line x1="40" y1="534" x2="110" y2="534"/>
    <line x1="160" y1="560" x2="250" y2="560"/>
    <line x1="300" y1="584" x2="360" y2="584"/>
    <line x1="80" y1="586" x2="130" y2="586"/>
    <line x1="520" y1="548" x2="580" y2="548"/>
  </g>
  <!-- little canoe -->
  <path d="M140,548 q30,10 60,0 l-6,6 q-24,6 -48,0 z" fill="#b5532f"/>
  <line x1="172" y1="534" x2="166" y2="552" stroke="#3b2a1a" stroke-width="2"/>
  <circle cx="168" cy="540" r="4" fill="#d9822b"/>
</svg>
