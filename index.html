<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mountain Slide Puzzle</title>
  <meta name="theme-color" content="#2f5f9a">
  <!-- iPhone home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mountains">
  <link rel="apple-touch-icon" href="assets/images/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/style.css?v=2">
</head>
<body>
  <header>
    <h1 data-t="title">Mountain Slide Puzzle</h1>
    <div class="stats">
      <span><span data-t="movesLabel">Moves:</span> <strong id="moves">0</strong></span>
      <span><span data-t="timeLabel">Time:</span> <strong id="time">0:00</strong></span>
      <select id="lang-select" class="lang-select" aria-label="Language"></select>
    </div>
  </header>

  <main class="board-wrap">
    <section class="column left-column">
      <h2 data-t="heading">Slide the tiles</h2>
      <p class="instructions" data-t="instructions">Tap a tile next to the empty space to slide it. Put the mountain picture back together.</p>
      <div id="board" class="board"></div>
    </section>

    <section class="column right-column">
      <h2 data-t="picture">Picture</h2>
      <img class="preview" src="assets/images/mountains.jpg" alt="" draggable="false">
      <p class="credit">Grand Teton National Park, Wyoming</p>
      <p class="message" id="message"></p>
      <div class="option-row">
        <span data-t="size">Size</span>
        <div class="segmented" id="size-buttons">
          <button type="button" data-size="3">3×3</button>
          <button type="button" data-size="4">4×4</button>
          <button type="button" data-size="5">5×5</button>
        </div>
      </div>
      <label class="option-row toggle">
        <input type="checkbox" id="numbers-toggle">
        <span data-t="numbers">Numbers</span>
      </label>
      <div class="controls">
        <button id="solve-btn" class="secondary" data-t="solve">Solve it</button>
        <button id="new-btn" data-t="newGame">New game</button>
      </div>
      <button id="score-btn" class="score-btn" hidden data-t="enterName">Enter name for high score</button>
    </section>
  </main>

  <!-- High score popup -->
  <div id="score-modal" class="modal" hidden>
    <form id="score-form" class="modal-box" autocomplete="off">
      <h2 data-t="highScore">High Score!</h2>
      <p id="score-summary"></p>
      <label for="name-input" data-t="yourName">Enter your name</label>
      <input id="name-input" type="text" maxlength="40" autocapitalize="words" spellcheck="false" required>
      <div class="controls">
        <button type="submit" data-t="save">Save</button>
        <button type="button" id="cancel-btn" class="secondary" data-t="cancel">Cancel</button>
      </div>
    </form>
  </div>

  <script src="src/game.js?v=2"></script>
  <script>
    // Offline support (only works when served over http/https, not from a file).
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
